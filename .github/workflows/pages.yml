name: Publicar carta no GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Remover título da área de fotos
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("Para_Minha_Futura_Esposa_v5_Safari_Nuvem.html")
          text = path.read_text(encoding="utf-8")
          text = text.replace("<h3>📷 Nossas fotos</h3>", "")
          path.write_text(text, encoding="utf-8")
          PY

      - name: Preparar arquivos do site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
